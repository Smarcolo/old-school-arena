<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old School Arena</title>
<link rel="stylesheet" href="stile.css">
</head>
<body>
<header>
  <h1>Old School Arena</h1>
  <span id="info">Nessuna partita</span>
  <span class="scelta-mazzi">
    <label>Tu <select id="mazzo"></select></label>
    <label>Avversaria <select id="mazzo-avversaria"></select></label>
    <a class="link" href="mazzi.html">Mazzi</a>
    <a class="link" href="torneo.html">Torneo</a>
  </span>
  <button id="nuova">Nuovo incontro</button>
  <span class="salvati" id="riquadro-salvati" hidden>
    <select id="salvati" aria-label="Partite e tornei salvati"></select>
    <button id="riprendi" type="button">Riprendi</button>
    <button id="elimina-salvato" type="button" title="Elimina il salvataggio">✕</button>
  </span>
</header>
<section id="turno" hidden></section>
<p id="messaggio" role="status"></p>
<div id="menu-carta" hidden></div>
<main>
  <section class="giocatore" id="avversaria"></section>
  <section class="pila"><div class="etichetta">Pila</div><div class="fila" id="pila"></div></section>
  <section class="giocatore" id="tu"></section>
  <section class="mano" id="mano"></section>
  <aside>
    <h2>Giudice</h2>
    <form id="giudice">
      <input id="domanda" autocomplete="off" placeholder="Es. il banding funziona con travolgere?">
    </form>
    <p id="risposta-giudice"></p>
    <h2>Registro</h2>
    <ol id="eventi"></ol>
  </aside>
</main>
<div id="barra-combattimento" hidden></div>
<section id="pannello-sideboard" hidden></section>
<script src="comune.js"></script>
<script src="app.js"></script>
</body>
</html>
