# Le top 8 degli ultimi 5 tornei Old School da TCDecks, salvate in docs/tornei_tcdecks.json: il gioco (PC e iPad)
# le legge da lì, perché dal browser TCDecks non si raggiunge. Ogni lunedì, oppure a mano da «Actions».
name: Tornei TCDecks

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Scarica i tornei
        env:
          OSA_DATI: ${{ runner.temp }}/dati
        run: python -m app.cards.tcdecks --json docs/tornei_tcdecks.json
      - name: Pagine scaricate (per capire cosa non va)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcdecks-diagnosi
          path: ${{ runner.temp }}/dati/tcdecks_diagnosi
          if-no-files-found: ignore
      - name: Salva
        run: |
          git config user.name "tornei-tcdecks"
          git config user.email "actions@users.noreply.github.com"
          git add docs/tornei_tcdecks.json
          git diff --cached --quiet || (git commit -m "Tornei TCDecks aggiornati" && git push)
