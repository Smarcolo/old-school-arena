# Le top 8 degli ultimi 5 tornei Old School da TCDecks, salvate in docs/tornei_tcdecks.json: il gioco (PC e iPad)
# le legge da lì, perché dal browser TCDecks non si raggiunge. Solo a mano da «Actions»: per ora TCDecks risponde ai
# programmi con una verifica anti-bot («Verificando que no eres un bot») e le pagine dei tornei non arrivano.
name: Tornei TCDecks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Scarica i tornei
        env:
          OSA_DATI: ${{ runner.temp }}/dati
        run: python -m app.cards.tcdecks --json docs/tornei_tcdecks.json
      - name: Pagine scaricate (per capire cosa non va)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcdecks-diagnosi
          path: ${{ runner.temp }}/dati/tcdecks_diagnosi
          if-no-files-found: ignore
      - name: Pagine scaricate anche sul ramo tcdecks-diagnosi (leggibili senza scaricare l'artifact)
        if: always()
        run: |
          D="${{ runner.temp }}/dati/tcdecks_diagnosi"
          [ -d "$D" ] || exit 0
          cd "$D"
          git init -q -b tcdecks-diagnosi
          git config user.name "tornei-tcdecks"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Pagine TCDecks dell'ultimo aggiornamento"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tcdecks-diagnosi
      - name: Salva
        run: |
          git config user.name "tornei-tcdecks"
          git config user.email "actions@users.noreply.github.com"
          git add docs/tornei_tcdecks.json
          git diff --cached --quiet || (git commit -m "Tornei TCDecks aggiornati" && git push)
