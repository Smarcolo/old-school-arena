<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old School Arena</title>
<link rel="stylesheet" href="stile.css">
</head>
<body>
<header>
  <h1>Old School Arena</h1>
  <span id="info">Nessuna partita</span>
  <button id="nuova">Nuova partita</button>
</header>
<main>
  <section class="giocatore" id="avversaria"></section>
  <section class="pila"><div class="etichetta">Pila</div><div class="fila" id="pila"></div></section>
  <section class="giocatore" id="tu"></section>
  <aside>
    <h2>Registro</h2>
    <ol id="eventi"></ol>
  </aside>
</main>
<div id="barra-combattimento" hidden></div>
<form id="comando">
  <input id="testo" autocomplete="off" placeholder="Scrivi un comando: gioca forest, passa, mano, aiuto…" disabled>
  <button disabled>Invia</button>
  <button type="button" class="rapido" data-comando="passa" disabled>Passa</button>
  <button type="button" class="rapido" data-comando="fine turno" disabled>Fine turno</button>
</form>
<p id="messaggio" role="status"></p>
<script src="app.js"></script>
</body>
</html>
